<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Anti-XSS Shield</title>
    <style>
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
        }
        h2 {
            font-size: 16px;
            margin-top: 0;
            color: #ff5252;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status {
            font-size: 12px;
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #4CAF50;
        }
        .logs-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #b0b0b0;
        }
        .log-list {
            max-height: 200px;
            overflow-y: auto;
            background: #1a1a1a;
            border-radius: 6px;
            padding: 6px;
            font-size: 11px;
        }
        .log-item {
            padding: 6px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .log-item:last-child {
            border-bottom: none;
        }
        .log-domain {
            color: #ff8a80;
            font-weight: bold;
        }
        .log-time {
            color: #757575;
            font-size: 10px;
        }
        .empty {
            text-align: center;
            color: #757575;
            padding: 20px;
            font-size: 12px;
        }
        #whitelist-btn {
            transition: background 0.2s ease;
        }
        #whitelist-btn:hover {
            background: #45a049 !important;
        }
    </style>
</head>
<body>
    <h2>🛡️ Anti-XSS Shield Pro</h2>
    <div class="status">
        Статус защиты: <b>Активна (Уровень 3)</b>
    </div>
    
    <div class="logs-title">Последние заблокированные угрозы:</div>
    <div class="log-list" id="logList">
        <div class="empty">Угроз пока не обнаружено ✨</div>
    </div>

    <!-- Кнопка добавления сайта в исключения -->
    <button id="whitelist-btn" style="width: 100%; margin-top: 10px; padding: 8px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Доверять этому сайту</button>

    <script src="popup.js"></script>
</body>
</html>
